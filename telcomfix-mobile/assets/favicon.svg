  <rect width="512" height="512" rx="128" fill="#FF3B5C"/>
  
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Left Signal Arc -->
    <path d="M 172 152 A 130 130 0 0 0 172 320" stroke-width="32"/>
    <!-- Inner Left Signal Arc -->
    <path d="M 206 186 A 80 80 0 0 0 206 286" stroke-width="32"/>
    
    <!-- Outer Right Signal Arc -->
